<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <title>统一智能政务服务平台</title>
  <style>
    :root {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #122238;
      background: #f4f6f8;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    main {
      width: min(460px, 100%);
      padding: 30px;
      border: 1px solid #d9e1e8;
      background: #fff;
      box-shadow: 0 18px 48px rgb(18 34 56 / 10%);
    }
    header {
      display: flex;
      align-items: center;
      gap: 13px;
      margin-bottom: 25px;
    }
    .mark {
      display: grid;
      width: 46px;
      height: 46px;
      place-items: center;
      background: #0b3e73;
      color: #fff;
      font-weight: 800;
    }
    h1 {
      margin: 0;
      font-size: 19px;
    }
    p {
      margin: 7px 0 0;
      color: #647386;
      line-height: 1.6;
      font-size: 13px;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 15px 0;
      font-weight: 650;
    }
    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid #cbd6df;
      border-top-color: #0d5cab;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    button {
      display: none;
      width: 100%;
      margin-top: 16px;
      padding: 12px 16px;
      border: 0;
      background: #0b3e73;
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button.visible { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .spinner { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="mark">政</div>
      <div>
        <h1>统一智能政务服务平台</h1>
        <p>可信办事助手 · 概念演示</p>
      </div>
    </header>
    <div class="status" aria-live="polite">
      <span class="spinner" aria-hidden="true"></span>
      <span id="status-text">正在连接演示服务...</span>
    </div>
    <p id="detail">入口地址保持不变，系统正在寻找当前可用的演示节点。</p>
    <button id="retry" type="button">重新连接</button>
  </main>
  <script>
    const statusText = document.querySelector("#status-text");
    const detail = document.querySelector("#detail");
    const retry = document.querySelector("#retry");

    async function connect() {
      retry.classList.remove("visible");
      statusText.textContent = "正在连接演示服务...";
      detail.textContent = "入口地址保持不变，系统正在寻找当前可用的演示节点。";

      try {
        const response = await fetch(`target.json?t=${Date.now()}`, { cache: "no-store" });
        if (!response.ok) throw new Error(`配置读取失败：${response.status}`);
        const target = await response.json();
        if (!/^https:\/\/[a-z0-9.-]+(?:\/.*)?$/i.test(target.url || "")) {
          throw new Error("演示服务地址无效");
        }
        statusText.textContent = "连接成功，正在进入...";
        window.location.replace(target.url);
      } catch (error) {
        statusText.textContent = "演示服务暂时不可达";
        detail.textContent = "请稍后重试。本机重新连接公网节点后，固定入口通常会在一分钟内自动恢复。";
        retry.classList.add("visible");
      }
    }

    retry.addEventListener("click", connect);
    connect();
  </script>
</body>
</html>
